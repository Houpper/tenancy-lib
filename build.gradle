plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.com.houpper'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
    maven {
        url = uri("https://maven.pkg.github.com/houpper/common-lib")

        credentials {
            username = System.getenv("GITHUB_ACTOR")
            password = System.getenv("GITHUB_TOKEN")
        }
    }
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/houpper/common-lib")

            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}

ext {
    set('springBootVersion', "4.1.1")
    set('springCloudVersion', "2025.1.3")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {

    compileOnly 'org.springframework:spring-context'

    // Hibernate Core
    compileOnly 'org.hibernate.orm:hibernate-core'

    compileOnly 'org.springframework.boot:spring-boot-hibernate'

    // Spring Auto Configure
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation libs.junit
}

tasks.named('test') {
    useJUnitPlatform()
}

apply from: "gradle/scripts/build-info.gradle"